#cloud-config
#
# UbuntuRicePack hybrid Ubuntu Desktop autoinstall template.
#
# IMPORTANT:
#   1. Do not import this template until the password placeholder below has
#      been replaced. Run:
#        bash installation/prepare-autoinstall.sh
#   2. Storage and networking deliberately remain interactive.
#   3. There is intentionally NO `storage:` section. The Ubuntu installer must
#      show its normal disk screen so that the operator chooses erase,
#      alongside/dual-boot, or manual partitioning on the actual machine.
#
autoinstall:
  version: 1

  # These are the only installer pages that remain interactive. In
  # particular, never replace `storage` with an automated disk recipe. Select
  # a working Internet connection because the pinned bootstrap requires it.
  interactive-sections:
    - network
    - storage

  locale: en_US.UTF-8
  keyboard: 
    layout: us
    variant: ""
  timezone: Asia/Karachi

  identity:
    realname: Ibrahim Hussain
    username: ibrahim
    hostname: ibLaptop
    # Generate this locally with installation/prepare-autoinstall.sh.
    # It may represent a short password, but password-authenticated SSH with a
    # weak password must never be exposed directly to the public internet.
    password: "$6$Zj.gtH/WgiY/URTh$USkli5SsrwBoODE8lEhNUbjsI9pN0N6YXkdAqTf8k7LZPRdXJxeEuViPt8D2k9idr07kupF.NqpzotVOwXMxc/"

  # The machine is intended to act as a server as well as a GNOME desktop.
  # Root login is disabled again in late-commands. Password login is enabled
  # so the server is immediately usable; migrate to an SSH key afterward.
  ssh:
    install-server: true
    allow-pw: true
    authorized-keys: []

  drivers:
    install: true
  codecs:
    install: true
  oem:
    install: auto
  updates: all

  # These packages are needed before the pinned repository bootstrap and its
  # first-login GNOME stage. The rice installs its complete package set later.
  packages:
    - ca-certificates
    - curl
    - git
    - gdb
    - build-essential
    - gcc
    - g++
    - clang
    - gnome-terminal
    - openssh-server
    - python3
    - python3-yaml
    - rsync

  # Do not request any Snap packages. The late command also removes the
  # Desktop image's seeded snapd/Firefox packages and pins them out.
  snaps: []

  late-commands:
    - |
      set -eu

      TARGET=/target
      USER_NAME=ibrahim
      USER_HOME=/home/ibrahim
      RICE_DIR="$USER_HOME/ubuntuRicePack"
      RICE_URL=https://github.com/ib-hussain/ubuntuRicePack.git
      RICE_COMMIT=7e7269acecbda4545b1ff89864e6178475b28e12

      # Enforce the repository's no-Snap/no-Firefox policy in the installed
      # target without relying on a service running inside the chroot.
      install -d -m 0755 "$TARGET/etc/apt/preferences.d"
      cat >"$TARGET/etc/apt/preferences.d/00-no-snapd-firefox" <<'NO_SNAP_PREFERENCE'
      Package: snapd firefox
      Pin: release *
      Pin-Priority: -10
      NO_SNAP_PREFERENCE

      for package in firefox snapd; do
          if chroot "$TARGET" dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null |
              grep -qx installed
          then
              chroot "$TARGET" env DEBIAN_FRONTEND=noninteractive \
                  apt-get purge -y "$package"
          fi
      done
      chroot "$TARGET" apt-mark hold snapd firefox

      for package in firefox snapd; do
          if chroot "$TARGET" dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null |
              grep -qx installed
          then
              printf 'ERROR: prohibited package remains installed: %s\n' "$package" >&2
              exit 1
          fi
      done

      # Install and validate a real SSH server. Password login is kept for the
      # requested immediately usable server; direct root login stays disabled.
      install -d -m 0755 "$TARGET/etc/ssh/sshd_config.d"
      cat >"$TARGET/etc/ssh/sshd_config.d/01-ubuntu-rice-server.conf" <<'SSH_CONFIG'
      PermitRootLogin no
      PasswordAuthentication yes
      KbdInteractiveAuthentication yes
      UsePAM yes
      SSH_CONFIG
      install -d -m 0755 "$TARGET/run/sshd"
      chroot "$TARGET" ssh-keygen -A
      chroot "$TARGET" sshd -t
      chroot "$TARGET" systemctl enable ssh.service

      # The rice installer intentionally uses sudo from the normal GNOME user.
      # Install a minimal, syntax-checked sudoers drop-in for that one account.
      printf '%s ALL=(ALL:ALL) NOPASSWD: ALL\n' "$USER_NAME" \
          >"$TARGET/etc/sudoers.d/90-ubuntu-rice-$USER_NAME"
      chmod 0440 "$TARGET/etc/sudoers.d/90-ubuntu-rice-$USER_NAME"
      chroot "$TARGET" visudo -cf "/etc/sudoers.d/90-ubuntu-rice-$USER_NAME"

      # Fetch exactly the reviewed product revision, not a moving branch tip.
      install -d -m 0755 "$TARGET$USER_HOME"
      chroot "$TARGET" git init "$RICE_DIR"
      chroot "$TARGET" git -C "$RICE_DIR" remote add origin "$RICE_URL"
      chroot "$TARGET" git -C "$RICE_DIR" fetch --depth=1 origin "$RICE_COMMIT"
      chroot "$TARGET" git -C "$RICE_DIR" checkout --detach FETCH_HEAD
      ACTUAL_COMMIT="$(chroot "$TARGET" git -C "$RICE_DIR" rev-parse HEAD)"
      if [ "$ACTUAL_COMMIT" != "$RICE_COMMIT" ]; then
          printf 'ERROR: expected rice commit %s, got %s\n' \
              "$RICE_COMMIT" "$ACTUAL_COMMIT" >&2
          exit 1
      fi

      # Run the GNOME-dependent product installer visibly, once, from the
      # first real GNOME login. A failed run remains scheduled for the next
      # login and writes to both a normal log and the user journal.
      install -d -m 0755 \
          "$TARGET$USER_HOME/.local/bin" \
          "$TARGET$USER_HOME/.config/autostart"
      cat >"$TARGET$USER_HOME/.local/bin/ubuntu-rice-first-login" <<'RICE_FIRST_LOGIN'
      #!/usr/bin/env bash
      set -Eeuo pipefail
      IFS=$'\n\t'
      umask 022

      RICE_DIR="$HOME/ubuntuRicePack"
      STATE_DIR="$HOME/.local/state/ubuntuRicePack/autoinstall"
      DONE_FILE="$STATE_DIR/first-login.complete"
      LOG_FILE="$STATE_DIR/first-login.log"
      AUTOSTART_FILE="$HOME/.config/autostart/ubuntu-rice-first-login.desktop"

      mkdir -p -- "$STATE_DIR"
      exec 9>"$STATE_DIR/first-login.lock"
      if ! flock -n 9; then
          exit 0
      fi

      if [[ -e "$DONE_FILE" ]]; then
          rm -f -- "$AUTOSTART_FILE"
          exit 0
      fi

      exec > >(tee -a "$LOG_FILE" >(systemd-cat -t ubuntu-rice-first-login)) 2>&1

      finish() {
          local status="$?"
          trap - EXIT
          if ((status == 0)); then
              printf '\nUbuntuRicePack completed successfully.\n'
              printf 'SSH is enabled. Verify it with: systemctl status ssh\n'
          else
              printf '\nUbuntuRicePack failed with status %s.\n' "$status" >&2
              printf 'Log: %s\n' "$LOG_FILE" >&2
              printf 'The first-login job remains enabled so it can be retried.\n' >&2
          fi
          read -r -p 'Press Enter to close this terminal...' _ || true
          exit "$status"
      }
      trap finish EXIT

      printf 'UbuntuRicePack first-login setup started at %s\n' \
          "$(date --iso-8601=seconds)"
      printf 'Pinned revision: %s\n' \
          "$(git -C "$RICE_DIR" rev-parse HEAD)"

      cd -- "$RICE_DIR"
      RICE_PASSWORDLESS_SUDO=0 \
          bash ./install-rice.sh --mode desktop --strict

      date --iso-8601=seconds >"$DONE_FILE"
      rm -f -- "$AUTOSTART_FILE"
      RICE_FIRST_LOGIN
      chmod 0755 "$TARGET$USER_HOME/.local/bin/ubuntu-rice-first-login"

      cat >"$TARGET$USER_HOME/.config/autostart/ubuntu-rice-first-login.desktop" <<'RICE_AUTOSTART'
      [Desktop Entry]
      Type=Application
      Version=1.0
      Name=Complete UbuntuRicePack Setup
      Comment=Apply the pinned GNOME desktop configuration once
      TryExec=gnome-terminal
      Exec=gnome-terminal --wait -- /home/ibrahim/.local/bin/ubuntu-rice-first-login
      Terminal=false
      OnlyShowIn=GNOME;Unity;
      X-GNOME-Autostart-enabled=true
      X-GNOME-Autostart-Delay=8
      RICE_AUTOSTART
      chmod 0644 \
          "$TARGET$USER_HOME/.config/autostart/ubuntu-rice-first-login.desktop"

      # Skip the generic GNOME first-run tour so it cannot obscure the visible
      # terminal that performs the product setup.
      touch "$TARGET$USER_HOME/.config/gnome-initial-setup-done"

      chroot "$TARGET" chown -R "$USER_NAME:$USER_NAME" \
          "$RICE_DIR" \
          "$USER_HOME/.local" \
          "$USER_HOME/.config"

      # Preserve an installer-side audit record in the installed system.
      install -d -m 0755 "$TARGET/var/log/installer"
      printf 'repository=%s\ncommit=%s\nssh=enabled\nstorage=interactive\n' \
          "$RICE_URL" "$RICE_COMMIT" \
          >"$TARGET/var/log/installer/ubuntu-rice-bootstrap.txt"

  error-commands:
    - |
      if [ -d /target/var/log ]; then
          install -d -m 0755 /target/var/log/installer
          journalctl -b --no-pager \
              >/target/var/log/installer/ubuntu-rice-installer-error-journal.log \
              2>&1 || true
      fi

  shutdown: reboot
