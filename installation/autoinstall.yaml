#cloud-config
#
# UbuntuRicePack Ubuntu Desktop autoinstall template.
#
# Prepare a private importable copy with:
#   bash installation/prepare-autoinstall.sh
#
# Storage and networking are deliberately interactive. There is no automated
# storage recipe: the operator must choose the destination disk and layout.
autoinstall:
  version: 1

  interactive-sections:
    - network
    - storage

  # Subiquity selects the first mirror that contains the ISO's suite. Current
  # Ubuntu 26.04 media uses the normal archive; end-of-life Ubuntu 25.04 media
  # falls through to Ubuntu's official old-releases archive. This restores
  # installability for Plucky but cannot restore security support.
  apt:
    preserve_sources_list: false
    mirror-selection:
      primary:
        - country-mirror
        - arches:
            - amd64
            - i386
          uri: http://archive.ubuntu.com/ubuntu
        - arches:
            - arm64
            - armhf
            - ppc64el
            - riscv64
            - s390x
          uri: http://ports.ubuntu.com/ubuntu-ports
        - uri: http://old-releases.ubuntu.com/ubuntu
    fallback: offline-install
    geoip: true

  locale: en_US.UTF-8
  keyboard:
    layout: us
    variant: ""
  timezone: Asia/Karachi

  identity:
    realname: Ibrahim Hussain
    username: ibrahim
    hostname: ibLaptop
    password: "$6$REPLACE_WITH_A_LOCAL_SHA512_CRYPT_HASH"

  ssh:
    install-server: true
    allow-pw: true
    authorized-keys: []

  drivers:
    install: true
  codecs:
    install: true
  oem:
    install: auto
  updates: all

  # Keep installation-time dependencies intentionally small. The full rice is
  # installed visibly after the first GNOME login, where failures can be read
  # and retried without aborting or damaging the operating-system install.
  packages:
    - ca-certificates
    - git
    - openssh-server

  snaps: []

  late-commands:
    - |
      set -eu

      TARGET=/target
      USER_NAME=ibrahim
      USER_HOME=/home/ibrahim

      # Configure policy files only. Do not download repositories, purge
      # packages, or run apt here: any non-zero late command aborts Subiquity.
      install -d -m 0755 "$TARGET/etc/apt/preferences.d"
      cat >"$TARGET/etc/apt/preferences.d/00-ubuntu-rice-no-snap" <<'NO_SNAP'
      # Managed by ubuntuRicePack.
      Package: snapd firefox
      Pin: release *
      Pin-Priority: -10
      NO_SNAP

      install -d -m 0755 "$TARGET/etc/ssh/sshd_config.d"
      cat >"$TARGET/etc/ssh/sshd_config.d/01-ubuntu-rice-server.conf" <<'SSH_CONFIG'
      PermitRootLogin no
      PasswordAuthentication yes
      KbdInteractiveAuthentication no
      UsePAM yes
      SSH_CONFIG

      install -d -m 0755 "$TARGET/run/sshd"
      curtin in-target --target="$TARGET" -- ssh-keygen -A
      curtin in-target --target="$TARGET" -- sshd -t
      curtin in-target --target="$TARGET" -- systemctl enable ssh.service

      printf '%s ALL=(ALL:ALL) NOPASSWD: ALL\n' "$USER_NAME" \
          >"$TARGET/etc/sudoers.d/90-ubuntu-rice-$USER_NAME"
      chmod 0440 "$TARGET/etc/sudoers.d/90-ubuntu-rice-$USER_NAME"
      curtin in-target --target="$TARGET" -- \
          visudo -cf "/etc/sudoers.d/90-ubuntu-rice-$USER_NAME"

      install -d -m 0755 \
          "$TARGET$USER_HOME/.local/bin" \
          "$TARGET$USER_HOME/.config/autostart" \
          "$TARGET$USER_HOME/.local/state/ubuntuRicePack/autoinstall"

      cat >"$TARGET$USER_HOME/.local/bin/ubuntu-rice-first-login" <<'FIRST_LOGIN'
      #!/usr/bin/env bash
      set -Eeuo pipefail
      IFS=$'\n\t'
      umask 022

      readonly RICE_URL="https://github.com/ib-hussain/ubuntuRicePack.git"
      readonly RICE_COMMIT="REPLACE_WITH_REPOSITORY_COMMIT"
      readonly RICE_DIR="$HOME/ubuntuRicePack"
      readonly STATE_DIR="$HOME/.local/state/ubuntuRicePack/autoinstall"
      readonly DONE_FILE="$STATE_DIR/first-login.complete"
      readonly LOG_FILE="$STATE_DIR/first-login.log"
      readonly AUTOSTART_FILE="$HOME/.config/autostart/ubuntu-rice-first-login.desktop"

      mkdir -p -- "$STATE_DIR"
      exec 9>"$STATE_DIR/first-login.lock"
      flock -n 9 || exit 0

      if [[ -e "$DONE_FILE" ]]; then
          rm -f -- "$AUTOSTART_FILE"
          exit 0
      fi

      if command -v systemd-cat >/dev/null 2>&1; then
          exec > >(tee -a "$LOG_FILE" >(systemd-cat -t ubuntu-rice-first-login)) 2>&1
      else
          exec > >(tee -a "$LOG_FILE") 2>&1
      fi

      finish() {
          local status="$?"
          trap - EXIT
          if ((status == 0)); then
              printf '\nUbuntuRicePack completed successfully.\n'
              printf 'SSH status: systemctl status ssh\n'
          else
              printf '\nUbuntuRicePack failed with status %s.\n' "$status" >&2
              printf 'Log: %s\n' "$LOG_FILE" >&2
              printf 'It will retry at the next login.\n' >&2
          fi
          read -r -p 'Press Enter to close this terminal...' _ || true
          exit "$status"
      }
      trap finish EXIT

      if [[ -e "$RICE_DIR" && ! -d "$RICE_DIR/.git" ]]; then
          printf 'Refusing to overwrite non-Git path: %s\n' "$RICE_DIR" >&2
          exit 1
      fi

      mkdir -p -- "$RICE_DIR"
      if [[ ! -d "$RICE_DIR/.git" ]]; then
          git -C "$RICE_DIR" init
          git -C "$RICE_DIR" remote add origin "$RICE_URL"
      else
          if [[ -n "$(git -C "$RICE_DIR" status --porcelain)" ]]; then
              printf 'Refusing to replace a dirty checkout: %s\n' "$RICE_DIR" >&2
              exit 1
          fi
          git -C "$RICE_DIR" remote set-url origin "$RICE_URL"
      fi

      fetched=0
      for attempt in 1 2 3 4 5; do
          if GIT_TERMINAL_PROMPT=0 git -C "$RICE_DIR" fetch \
              --depth=1 \
              --no-tags \
              origin \
              "$RICE_COMMIT"
          then
              fetched=1
              break
          fi
          printf 'Fetch attempt %s failed; retrying.\n' "$attempt" >&2
          sleep "$((attempt * 3))"
      done
      ((fetched == 1)) || {
          printf 'Could not fetch pinned revision %s.\n' "$RICE_COMMIT" >&2
          exit 1
      }

      git -C "$RICE_DIR" checkout --detach FETCH_HEAD
      actual_commit="$(git -C "$RICE_DIR" rev-parse HEAD)"
      [[ "$actual_commit" == "$RICE_COMMIT" ]] || {
          printf 'Expected %s but checked out %s.\n' \
              "$RICE_COMMIT" "$actual_commit" >&2
          exit 1
      }

      cd -- "$RICE_DIR"
      RICE_PASSWORDLESS_SUDO=0 bash ./install-rice.sh -m desktop

      date --iso-8601=seconds >"$DONE_FILE"
      rm -f -- "$AUTOSTART_FILE"
      FIRST_LOGIN
      chmod 0755 "$TARGET$USER_HOME/.local/bin/ubuntu-rice-first-login"

      cat >"$TARGET$USER_HOME/.config/autostart/ubuntu-rice-first-login.desktop" <<'AUTOSTART'
      [Desktop Entry]
      Type=Application
      Version=1.0
      Name=Complete UbuntuRicePack Setup
      Comment=Fetch and apply the pinned desktop configuration
      Exec=/home/ibrahim/.local/bin/ubuntu-rice-first-login
      Terminal=true
      OnlyShowIn=GNOME;Unity;
      X-GNOME-Autostart-enabled=true
      X-GNOME-Autostart-Delay=10
      AUTOSTART
      chmod 0644 \
          "$TARGET$USER_HOME/.config/autostart/ubuntu-rice-first-login.desktop"

      touch "$TARGET$USER_HOME/.config/gnome-initial-setup-done"
      curtin in-target --target="$TARGET" -- \
          chown -R "$USER_NAME:$USER_NAME" \
          "$USER_HOME/.local" \
          "$USER_HOME/.config"

      install -d -m 0755 "$TARGET/var/log/installer"
      cat >"$TARGET/var/log/installer/ubuntu-rice-bootstrap.txt" <<'AUDIT'
      storage=interactive
      network=interactive
      ssh=enabled
      rice_stage=deferred-to-first-login
      rice_commit=REPLACE_WITH_REPOSITORY_COMMIT
      AUDIT

  error-commands:
    - |
      if [ -d /target/var/log ]; then
          install -d -m 0755 /target/var/log/installer
          journalctl -b --no-pager \
              >/target/var/log/installer/ubuntu-rice-installer-error-journal.log \
              2>&1 || true
          tar -C /var/log -czf \
              /target/var/log/installer/ubuntu-rice-live-installer-logs.tar.gz \
              installer 2>/dev/null || true
      fi

  shutdown: reboot
